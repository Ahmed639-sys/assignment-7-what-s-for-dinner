<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's For Dinner</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <header class="header">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-utensils"></i></div>
      <div>
        <h1>What's For Dinner</h1>
        <p>Your daily meal inspiration</p>
      </div>
    </div>

    <div class="header-actions">
      <button class="icon-btn" id="headerBookmark" title="Saved"><i class="fa-solid fa-bookmark"></i></button>
      <button class="icon-btn" title="History"><i class="fa-solid fa-clock-rotate-left"></i></button>
      <button class="icon-btn" title="Settings"><i class="fa-solid fa-gear"></i></button>
      <img class="avatar" src="./images/avatar-4.jpg" alt="Profile">
    </div>
  </header>

  <main class="main">
    <section class="card" id="card"></section>
  </main>

  <div class="toast" id="toast"></div>

  <!-- data.js must come before app.js -->
  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>

</body>
</html>
